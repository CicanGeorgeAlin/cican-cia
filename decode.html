<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>CICAN — ACCESS PATH</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}
#hud{position:fixed;top:16px;left:16px;right:16px;z-index:30;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#brand{font-size:14px;font-weight:800;letter-spacing:3px}
#rank{text-align:right;font-size:9px;letter-spacing:2px;opacity:.58}
#progress{position:fixed;top:50px;left:16px;right:16px;height:1px;background:rgba(255,255,255,.12);z-index:30}
#progress i{display:block;height:100%;width:0;background:#fff;transition:width .35s}
#mission{position:fixed;left:50%;top:13%;transform:translateX(-50%);width:min(90vw,680px);text-align:center;z-index:5;pointer-events:none}
#label{font-size:9px;letter-spacing:4px;opacity:.35;margin-bottom:11px}
#topic{font-size:clamp(24px,6vw,42px);line-height:1.1;letter-spacing:1px}
#brief{margin:14px auto 0;max-width:600px;font-size:11px;line-height:1.6;color:rgba(255,255,255,.45)}
#hint{margin-top:15px;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.32)}#xp{margin-top:10px;font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.22)}
#record{position:fixed;left:50%;bottom:12%;transform:translateX(-50%) scale(.94);width:min(88vw,520px);opacity:0;pointer-events:none;border:1px solid rgba(255,255,255,.35);background:#080808;color:#fff;padding:18px;border-radius:12px;text-align:left;transition:.25s;z-index:25}
#record.ready{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
#record .level{font-size:9px;letter-spacing:3px;opacity:.45}
#record h2{font-size:19px;letter-spacing:1px;margin:8px 0}
#record p{font-size:11px;line-height:1.55;color:rgba(255,255,255,.62);margin:0 0 14px}
.actions{display:flex;gap:8px}
.actions a,.actions button{flex:1;text-align:center;text-decoration:none;border:1px solid #fff;background:#fff;color:#000;padding:11px 8px;border-radius:8px;font-size:9px;font-weight:800;letter-spacing:1.5px}
.actions button{background:#000;color:#fff}
#source{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;font-size:8px;letter-spacing:1.2px;color:rgba(255,255,255,.24);white-space:nowrap}
#source a{color:inherit}
#back{position:fixed;right:16px;top:68px;z-index:30;border:1px solid rgba(255,255,255,.22);background:#050505;color:#fff;border-radius:16px;padding:7px 11px;font-size:8px;letter-spacing:1.5px}
.cican{position:absolute;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 10px #fff,0 0 25px rgba(255,255,255,.8),0 0 45px rgba(255,255,255,.4)}
.cican-face{position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);pointer-events:none}
.trail{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none;opacity:.8;box-shadow:0 0 6px #fff;animation:fadeTrail 1.5s linear forwards}@keyframes fadeTrail{from{opacity:.8}to{opacity:0}}
.knowledge{position:absolute;width:68px;height:68px;border-radius:50%;background:#fff;color:#000;transform:translate(-50%,-50%);z-index:3000;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;letter-spacing:1px;user-select:none;touch-action:none;cursor:grab;box-shadow:0 0 14px #fff,0 0 30px #fff,0 0 55px rgba(255,255,255,.8)}
.eye{position:absolute;width:22%;height:34%;top:28%;background:#000;border-radius:50%}.eye.l{left:18%}.eye.r{right:18%}
.pulse{position:absolute;border:1px solid rgba(255,255,255,.55);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pulse 900ms ease-out forwards}
@keyframes pulse{from{width:20px;height:20px;opacity:.8}to{width:260px;height:260px;opacity:0}}
@media(max-width:520px){#record{bottom:8%;max-height:76vh;overflow:auto}.actions{flex-direction:column}#source{font-size:8px;white-space:normal;text-align:center;width:90vw;line-height:1.5}}
</style>
<style>
/* Readability layer — gameplay mechanics unchanged */
#label,#rank{font-size:10px}
#brief{font-size:13px;line-height:1.7}
#hint{font-size:11px;line-height:1.5}
#xp{font-size:10px}
#record .level{font-size:10px}
#record h2{font-size:21px}
#record p{font-size:13px;line-height:1.65}
#record .sourceLabel{font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,.5);margin:0 0 8px}
.actions a,.actions button{font-size:10px;padding:12px 9px}
#source{font-size:9px}
#back{font-size:9px}
@media(max-width:520px){#source{font-size:8px}}
</style>
</head>
<body>
<div id="hud"><div id="brand">CICAN</div><div id="rank">RECRUIT<br><span>SIMULATION</span></div></div>
<div id="progress"><i></i></div>
<button id="back">EXIT</button>
<div id="mission">
  <div id="label">ACCESS PATH</div>
  <div id="topic"></div>
  <div id="brief"></div>
  <div id="hint">Find the way in.</div><div id="xp" aria-live="polite">XP 0 · DISCOVERIES 0</div>
</div>
<div id="record">
  <div class="level" id="recordLevel">SIMULATED ACCESS</div>
  <h2 id="recordTitle"></h2>
  <p id="recordText"></p>
  <div class="actions">
    <div class="sourceLabel">PUBLIC DOCUMENT · OPEN THE ORIGINAL CIA FOIA RECORD</div><a id="sourceLink" target="_blank" rel="noopener">READ ORIGINAL PUBLIC DOCUMENT →</a>
    <button id="advance">I READ IT — CONTINUE</button>
  </div>
</div>
<div id="source">SIMULATED ACCESS · PUBLIC / DECLASSIFIED MATERIAL ONLY · <a href="https://www.cia.gov/readingroom/" target="_blank" rel="noopener">CIA FOIA READING ROOM</a></div>
<script>
const MIN_SIZE=34,MAX_SIZE=180,GROWTH=.5,DOUBLE_TAP=350,SPLIT_OFFSET=45,MERGE_DISTANCE=20;
const ranks=[
 {name:"RECRUIT",label:"ORIENTATION",note:"Learn to identify a record before you open it."},
 {name:"ANALYST",label:"CONFIDENTIAL",note:"Formal classification level — simulated for gameplay."},
 {name:"ANALYST",label:"SECRET",note:"Formal classification level — simulated for gameplay."},
 {name:"SENIOR ANALYST",label:"TOP SECRET",note:"Highest formal U.S. classification level — simulated for gameplay."},
 {name:"SCI",label:"SENSITIVE COMPARTMENTED INFORMATION",note:"Controlled-access layer. Not a fourth classification level."},
 {name:"SI",label:"COMPARTMENT",note:"Historical control-channel example; the exact handling depends on the program and record."},
 {name:"TK",label:"COMPARTMENT",note:"Historical control-channel example; access remains separately controlled."},
 {name:"GAMMA",label:"COMPARTMENT",note:"Historical term from declassified material; treated here as a simulated compartment."},
 {name:"NEED-TO-KNOW",label:"FINAL GATE",note:"Having a classification level or compartment does not automatically mean access to every record."}
];
const records=[
 {keys:["cold","soviet","communism","russia","eastern europe"],title:"The Collapse of Communism in Eastern Europe",text:"A CIA historical collection covering National Intelligence Daily reporting from February 1989 to March 1990.",url:"https://www.cia.gov/readingroom/"},
 {keys:["ufo","uap","aquiline","drone","aircraft"],title:"Aquiline",text:"A declassified collection on a 1960s CIA concept for unmanned aerial intelligence collection.",url:"https://www.cia.gov/readingroom/"},
 {keys:["nuclear","missile","weapon","ussr"],title:"Current/Central Intelligence Bulletin",text:"Historical presidential intelligence reporting, including material from the Kennedy era and the Cold War.",url:"https://www.cia.gov/readingroom/"},
 {keys:["espionage","spy","agent","operation"],title:"CIA FOIA Electronic Reading Room",text:"The public gateway to declassified CIA records and historical collections.",url:"https://www.cia.gov/readingroom/"},
 {keys:["psychology","psychic","remote viewing","stargate"],title:"STARGATE / Remote Viewing Records",text:"CIA-hosted historical material concerning the U.S. government's declassified remote-viewing research.",url:"https://www.cia.gov/stories/story/ask-molly-did-cia-really-study-psychic-powers"},
 {keys:["vietnam","laos","cuba","bay of pigs"],title:"Current Intelligence Bulletin — 1961",text:"A historical intelligence collection covering events including the Bay of Pigs, Congo crisis, Soviet activity and Laos.",url:"https://www.cia.gov/readingroom/"}
];
const topic=(new URLSearchParams(location.search).get("topic")||"THE READING ROOM").trim();
const lower=topic.toLowerCase();
const localRecords=records;
let record=localRecords.find(r=>r.keys.some(k=>lower.includes(k)))||localRecords[3];
async function loadCatalog(){
 try{
  const res=await fetch("records.json",{cache:"no-store"});
  if(!res.ok)throw new Error("catalog");
  const data=await res.json();
  const match=data.records.find(r=>r.topics.some(k=>lower.includes(k)));
  if(match){
   record={keys:match.topics,title:match.title,text:match.description,url:match.source,directUrl:match.directSource||match.source,simulationAccess:match.simulationAccess,sourceClassification:match.sourceClassification};
   document.getElementById("brief").textContent=match.sourceNote+" Access path: "+match.simulationAccess+" simulation gate.";
  }
 }catch(e){document.getElementById("brief").textContent=record.text+" "+ranks[stage].note+" Public catalog unavailable.";document.getElementById("sourceLink").href=record.url;}
}
loadCatalog();
const accessTrail=["RECRUIT","CONFIDENTIAL","SECRET","TOP SECRET","SCI","SI","TK","GAMMA","NEED-TO-KNOW"];
const PROFILE_KEY="cicanCiaProfile";
let profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{"xp":0,"discoveries":0,"records":0,"verified":0,"lessons":0}');
let stage=Math.min(Number(localStorage.getItem("cicanCiaStage")||0),ranks.length-1);
function saveProfile(){localStorage.setItem(PROFILE_KEY,JSON.stringify(profile))}
function award(kind,amount,label){
 profile.xp+=amount;
 if(kind==="discovery")profile.discoveries++;
 if(kind==="record")profile.records++;
 if(kind==="verified")profile.verified++;
 if(kind==="lesson")profile.lessons++;
 saveProfile();renderXP();
 document.getElementById("hint").textContent=label+"  +"+amount+" XP";
}
function renderXP(){document.getElementById("xp").textContent="XP "+profile.xp+" · DISCOVERIES "+profile.discoveries+" · RECORDS "+profile.records}

document.getElementById("topic").textContent=topic.toUpperCase();
document.getElementById("brief").textContent=record.text+" "+ranks[stage].note;
function renderRank(){
 document.getElementById("rank").innerHTML=ranks[stage].name+"<br><span>"+ranks[stage].label+"</span>";
 document.getElementById("progress").firstElementChild.style.width=(stage/(ranks.length-1)*100)+"%";
}
renderRank();renderXP();
let ones=[],selected=null,growing=false,lastTap=0,lastTapped=null,readUnlocked=false,readObjects=[];
const TRAIL_DISTANCE=35;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function make(x,y,size=MIN_SIZE,isMemory=false){const el=document.createElement("div");el.className="cican"+(isMemory?" memory-one":"");document.body.appendChild(el);return{x,y,targetX:x,targetY:y,size,el,lastTrailX:x,lastTrailY:y}}
function face(o){o.el.style.width=o.size+"px";o.el.style.height=o.size+"px";o.el.style.left=o.x+"px";o.el.style.top=o.y+"px";o.el.innerHTML='<span class="cican-face"><span class="eye l"></span><span class="eye r"></span></span>'}
function spawn(x,y,size,isMemory=false){const o=make(x,y,size,isMemory);ones.push(o);face(o);return o}
function createTrail(x,y){const t=document.createElement("div");t.className="trail";t.style.left=x+"px";t.style.top=y+"px";document.body.appendChild(t);setTimeout(()=>t.remove(),1500)}
function split(o){const n=spawn(o.x+SPLIT_OFFSET,o.y,MIN_SIZE,false);n.targetX=n.x;n.targetY=n.y;selected=o;growing=false}
function pulse(x,y){const p=document.createElement("div");p.className="pulse";p.style.left=x+"px";p.style.top=y+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),950)}
function merge(a,b){const fullA=a.size>=MAX_SIZE,fullB=b.size>=MAX_SIZE,x=(a.x+b.x)/2,y=(a.y+b.y)/2,mergedSize=Math.min(MAX_SIZE,a.size+b.size);a.el.remove();b.el.remove();ones=ones.filter(o=>o!==a&&o!==b);const n=spawn(x,y,mergedSize,fullA&&fullB);pulse(x,y);selected=n;growing=false;if(fullA&&fullB){award("discovery",50,"ACCESS DISCOVERY");unlockRead(x,y)}}
function createReadObject(x,y){if(readObjects.length)return;const el=document.createElement("div");el.className="knowledge";el.textContent="READ";document.body.appendChild(el);const k={x,y,targetX:x,targetY:y,el,dragging:false,moved:false,downX:0,downY:0};readObjects.push(k);el.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();k.dragging=true;k.moved=false;k.downX=e.clientX;k.downY=e.clientY;try{el.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});el.addEventListener("pointermove",e=>{if(!k.dragging)return;e.preventDefault();e.stopPropagation();if(dist({x:e.clientX,y:e.clientY},{x:k.downX,y:k.downY})>8)k.moved=true;k.targetX=e.clientX;k.targetY=e.clientY},{passive:false});const end=e=>{if(!k.dragging)return;e.preventDefault();e.stopPropagation();k.dragging=false;if(!k.moved)document.getElementById("record").classList.add("ready")};el.addEventListener("pointerup",end,{passive:false});el.addEventListener("pointercancel",()=>{k.dragging=false});updateReadObject(k)}
function updateReadObject(k){k.x+=(k.targetX-k.x)*.10;k.y+=(k.targetY-k.y)*.10;const r=34;k.x=Math.max(r,Math.min(innerWidth-r,k.x));k.y=Math.max(r,Math.min(innerHeight-r,k.y));k.el.style.left=k.x+"px";k.el.style.top=k.y+"px"}
function unlockRead(x,y){if(readUnlocked)return;readUnlocked=true;document.getElementById("rank").innerHTML="SIMULATED ACCESS<br><span>"+ranks[stage].label+"</span>";document.getElementById("hint").textContent="READ unlocked. Find the record.";document.getElementById("recordLevel").textContent=ranks[stage].label+" · SIMULATION";document.getElementById("recordTitle").textContent=record.title;document.getElementById("recordText").textContent=record.text;document.getElementById("sourceLink").href=record.directUrl||record.url;createReadObject(x,y)}
document.getElementById("advance").onclick=()=>{
 if(stage<ranks.length-1){stage++;localStorage.setItem("cicanCiaStage",stage);award("lesson",100,"NEW ACCESS LAYER")}else{award("verified",150,"FINAL GATE VERIFIED")}
 document.getElementById("record").classList.remove("ready");
 document.getElementById("hint").textContent=stage===ranks.length-1?"The final compartment is open.":"Access path advanced. Find the way in again.";
 renderRank();reset();
};
function reset(){ones.forEach(o=>o.el.remove());ones=[];readObjects.forEach(k=>k.el.remove());readObjects=[];document.querySelectorAll(".trail").forEach(e=>e.remove());readUnlocked=false;document.getElementById("record").classList.remove("ready");selected=spawn(innerWidth/2,innerHeight/2,MIN_SIZE)}
function loop(){for(const o of ones){o.x+=(o.targetX-o.x)*.10;o.y+=(o.targetY-o.y)*.10;if(growing&&selected===o)o.size=Math.min(MAX_SIZE,o.size+GROWTH);if(dist(o,{x:o.lastTrailX,y:o.lastTrailY})>=TRAIL_DISTANCE){createTrail(o.x,o.y);o.lastTrailX=o.x;o.lastTrailY=o.y}face(o)}for(let i=0;i<ones.length;i++){for(let j=i+1;j<ones.length;j++){if(dist(ones[i],ones[j])<=MERGE_DISTANCE){merge(ones[i],ones[j]);i=ones.length;break}}}for(const k of readObjects)updateReadObject(k);requestAnimationFrame(loop)}
addEventListener("pointerdown",e=>{if(e.target.id==="back"||e.target.closest("#record")||e.target.closest(".knowledge"))return;let nearest=ones.reduce((a,o)=>!a||dist({x:e.clientX,y:e.clientY},o)<dist({x:e.clientX,y:e.clientY},a)?o:a,null);if(!nearest){lastTap=0;lastTapped=null;return}const now=performance.now();if(now-lastTap<DOUBLE_TAP&&lastTapped===nearest){split(nearest);lastTap=0;lastTapped=null;return}lastTap=now;lastTapped=nearest;selected=nearest;growing=true;selected.targetX=e.clientX;selected.targetY=e.clientY});
addEventListener("pointermove",e=>{if(!growing||!selected)return;if(e.target.closest("#record")||e.target.closest(".knowledge"))return;selected.targetX=e.clientX;selected.targetY=e.clientY});
addEventListener("pointerup",()=>growing=false);
document.getElementById("back").onclick=()=>location.href="index.html";
selected=spawn(innerWidth/2,innerHeight/2,MIN_SIZE);loop();
</script>
<div style="position:fixed;left:16px;bottom:16px;z-index:4;font-size:7px;letter-spacing:1px;color:rgba(255,255,255,.22)"><a href="legal.html" style="color:inherit">LEGAL &amp; SOURCE POLICY</a> · <a href="privacy.html">PRIVACY &amp; STORAGE</a></div>
</body>
</html>
