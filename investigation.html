<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>CICAN — FIELD INVESTIGATION</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;display:flex;justify-content:center}.wrap{width:min(94vw,820px);padding:28px 18px 60px}.top{display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:3px;font-size:12px}.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.2);padding:8px 11px;border-radius:16px;font-size:8px;letter-spacing:1.5px}h1{font-size:clamp(27px,7vw,48px);letter-spacing:3px;margin:45px 0 7px;text-align:center}.sub{text-align:center;font-size:9px;letter-spacing:3px;opacity:.4}.case{max-width:680px;margin:28px auto;border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:20px;background:#030303}.label{font-size:8px;letter-spacing:3px;opacity:.35}.question{font-size:18px;line-height:1.45;margin:10px 0 18px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px}.fact{border:1px solid rgba(255,255,255,.09);padding:11px;font-size:9px;line-height:1.5}.fact b{display:block;font-size:7px;letter-spacing:1px;opacity:.35;margin-bottom:4px}.task{margin-top:18px;color:rgba(255,255,255,.52);font-size:10px;line-height:1.6}.choices{display:grid;gap:8px;margin-top:16px}.choice{border:1px solid rgba(255,255,255,.16);background:#050505;color:#fff;padding:13px;text-align:left;border-radius:8px;font-size:9px;line-height:1.5}.choice:hover{border-color:#fff}.result{display:none;margin-top:16px;border:1px solid rgba(255,255,255,.18);padding:15px;border-radius:8px;font-size:10px;line-height:1.6}.result.show{display:block}.source{display:none;margin-top:10px;color:rgba(255,255,255,.4)}.source a{color:#fff}.next{display:none;margin-top:15px;padding:13px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:#050505}.next.show{display:block}.next b{font-size:8px;letter-spacing:2px;opacity:.4}.next a{display:block;margin-top:9px;color:#fff;text-decoration:none;font-size:10px}.xp{font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.25);margin-top:12px}
</style></head><body><main class="wrap"><div class="top"><div class="brand">CICAN</div><a class="back" href="academy.html">ACADEMY</a></div><h1 id="title">FIELD INVESTIGATION</h1><div class="sub">PUBLIC RECORD · RESEARCH SIMULATION</div><section class="case"><div class="label" id="caseId"></div><div class="question" id="question"></div><div class="facts" id="facts"></div><div class="task">Your task: choose the research approach that is most likely to locate and verify the underlying public record. This is a learning exercise, not a real-world intelligence instruction.</div><div class="choices" id="choices"></div><div class="result" id="result"></div><div class="source" id="source"></div><div class="xp" id="xp"></div><div class="next" id="next"></div></section></main>
<script>
const cases={
 romania:{code:"CASE 001",title:"RUMANIA",question:"You are researching a CIA record concerning Romanian military information from the 1960s. What search vocabulary should you test first?",facts:[["PERIOD","1960s"],["SUBJECT","Military information"],["LOCATION","Romania / Bucharest"],["RESEARCH PROBLEM","Historical terminology"],],choices:[["Search only “Romania”","weak"],["Test “Romania” plus historical spelling “Rumania”, location and subject terms","correct"],["Search only “CIA Romania secret”","weak"]],answer:"Historical archives may use period terminology that differs from modern spelling. The public catalog contains a declassified record whose topics include Romania, Rumania, military and Bucharest.",source:"https://www.cia.gov/readingroom/document/cia-rdp80-00247a001600110001-0",sourceName:"Open the underlying public CIA record"},
 reconnaissance:{code:"CASE 002",title:"RECONNAISSANCE",question:"You need to move from a broad Cold War topic toward a specific public document. Which path demonstrates better research discipline?",facts:[["PERIOD","Cold War"],["SUBJECT","Reconnaissance"],["PLATFORM","Aircraft"],["GOAL","Locate a specific document"]],choices:[["Keep searching “Cold War” indefinitely","weak"],["Combine reconnaissance + aircraft + intelligence collection and verify the resulting record","correct"],["Assume every aircraft record concerns reconnaissance","weak"]],answer:"A useful research query narrows the problem while retaining enough context to avoid an accidental match. CICAN rewards verification against the original record.",source:"https://www.cia.gov/readingroom/document/cia-rdp90t00782r000100120001-0",sourceName:"Open the underlying public CIA record"},
 vietnam:{code:"CASE 003",title:"VIETNAM",question:"You find a declassified document about infiltration groups in 1968. What should you verify before describing its classification?",facts:[["DATE","1968"],["REGION","Southeast Asia"],["SUBJECT","Infiltration groups"],["SOURCE","CIA FOIA document"]],choices:[["Repeat a classification from memory","weak"],["Check the original document page and its source metadata","correct"],["Assume every Vietnam record had the same classification","weak"]],answer:"Classification should be taken from the actual record, not inferred from its subject. The catalog entry identifies this document's original classification as Secret.",source:"https://www.cia.gov/readingroom/document/cia-rdp78t02095r000100060011-1",sourceName:"Open the underlying public CIA record"},
 berlin:{code:"CASE 005",title:"BERLIN",question:"You have identified Berlin as a Cold War subject. What should you do before treating a collection title as proof of a specific event?",facts:[["REGION","Berlin / Germany"],["PERIOD","Cold War"],["PROBLEM","Collection vs. conclusion"],["METHOD","Verify the underlying records"]],choices:[["Treat the collection title as the complete conclusion","weak"],["Open the collection and inspect what the underlying public records actually document","correct"],["Assume every Berlin record concerns the Berlin Wall","weak"]],answer:"A collection is a research entry point, not automatically the answer to every question about its subject. Verification requires examining the underlying public records.",source:"https://www.cia.gov/readingroom/",sourceName:"Open the CIA FOIA Electronic Reading Room"},
 stargate:{code:"CASE 004",title:"STARGATE",question:"A popular claim says the government studied psychic phenomena. What is the disciplined research response?",facts:[["COLLECTION","STARGATE"],["TOPIC","Remote viewing"],["SOURCE","Declassified public records"],["QUESTION","What does the archive actually establish?"]],choices:[["Treat the popular claim as the conclusion","weak"],["Find the public collection and distinguish documented program history from unsupported conclusions","correct"],["Ignore the records because the subject is unusual","weak"]],answer:"The correct research move is to inspect the primary public collection and distinguish what the records document from broader claims made elsewhere.",source:"https://www.cia.gov/readingroom/",sourceName:"Open the CIA FOIA Electronic Reading Room"}
};
const id=new URLSearchParams(location.search).get("id")||"romania";const c=cases[id]||cases.romania;
const nextMap={romania:["reconnaissance","berlin"],reconnaissance:["vietnam","berlin"],vietnam:["stargate"],stargate:["berlin"],berlin:["romania"]};

document.getElementById("title").textContent=c.title;document.getElementById("caseId").textContent=c.code;
document.getElementById("question").textContent=c.question;
document.getElementById("facts").innerHTML=c.facts.map(x=>"<div class=fact><b>"+x[0]+"</b>"+x[1]+"</div>").join("");
const box=document.getElementById("choices");
c.choices.forEach((x,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=x[0];b.onclick=()=>answer(x[1]);box.appendChild(b)});
function answer(kind){
 const result=document.getElementById("result");result.classList.add("show");
 if(kind==="correct"){
  const p=JSON.parse(localStorage.getItem("cicanCiaProfile")||'{"xp":0,"discoveries":0,"records":0,"verified":0,"lessons":0}');
  const key="cicanCase_"+id;
  if(!localStorage.getItem(key)){
   p.xp+=100;p.discoveries++;p.verified++;p.lessons=(p.lessons||0)+1;
   localStorage.setItem("cicanCiaProfile",JSON.stringify(p));
   localStorage.setItem(key,"1");
   document.getElementById("xp").textContent="CASE VERIFIED · +100 XP · LESSON RECORDED";
 }else{
   document.getElementById("xp").textContent="CASE ALREADY VERIFIED";
 }
  result.textContent=c.answer;
const next=document.getElementById("next");const choices=nextMap[id]||[];const available=choices.find(n=>!localStorage.getItem("cicanCase_"+n.toLowerCase()));if(available){next.classList.add("show");next.innerHTML="<b>NEW RESEARCH PATH DISCOVERED</b><a href=\"investigation.html?id="+available.toLowerCase()+"\">CONTINUE TO CASE → "+available.toUpperCase()+"</a>";}
  document.getElementById("source").style.display="block";
  document.getElementById("source").innerHTML='<a href="'+c.source+'" target="_blank" rel="noopener">'+c.sourceName+" →</a>";
  document.getElementById("source").innerHTML+='<div style="margin-top:8px;color:rgba(255,255,255,.28);font-size:8px;letter-spacing:1px">SOURCE VERIFIED · PUBLIC RECORD GATE</div>';
 }else{result.textContent="Not quite. The stronger research approach is the one that narrows the question and then verifies the answer against the original public source.";document.getElementById("xp").textContent="NO XP · TRY AGAIN";}
}
</script><div style="position:fixed;left:16px;bottom:16px;z-index:4;font-size:7px;letter-spacing:1px;color:rgba(255,255,255,.22)"><a href="legal.html" style="color:inherit">LEGAL &amp; SOURCE POLICY</a> · <a href="privacy.html">PRIVACY &amp; STORAGE</a></div>
