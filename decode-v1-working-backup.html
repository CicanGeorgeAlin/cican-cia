<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>CICAN CIA — DECODE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}
#hud{position:fixed;top:18px;left:18px;z-index:10;pointer-events:none}
#brand{font-size:15px;font-weight:800;letter-spacing:3px}
#state{margin-top:5px;font-size:9px;letter-spacing:2px;opacity:.45}
#mission{position:fixed;left:50%;top:18%;transform:translateX(-50%);width:min(88vw,620px);text-align:center;z-index:5;pointer-events:none}
#label{font-size:9px;letter-spacing:4px;opacity:.35;margin-bottom:13px}
#topic{font-size:clamp(24px,6vw,42px);line-height:1.15;letter-spacing:1px}
#hint{margin-top:18px;font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.4)}
#read{position:fixed;left:50%;bottom:12%;transform:translateX(-50%) scale(.92);opacity:0;pointer-events:none;border:1px solid #fff;background:#fff;color:#000;padding:15px 28px;border-radius:10px;font-size:12px;font-weight:800;letter-spacing:3px;transition:.25s;z-index:20}
#read.ready{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
#source{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;font-size:8px;letter-spacing:1.4px;color:rgba(255,255,255,.28);white-space:nowrap}
#source a{color:inherit}
#back{position:fixed;right:18px;top:18px;z-index:20;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.6);color:#fff;border-radius:18px;padding:8px 12px;font-size:9px;letter-spacing:1.5px}
.cican{position:absolute;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 10px #fff,0 0 25px rgba(255,255,255,.8),0 0 45px rgba(255,255,255,.35)}
.eye{position:absolute;background:#000;border-radius:50%;width:22%;height:34%;top:28%}.eye.l{left:18%}.eye.r{right:18%}
.pulse{position:absolute;border:1px solid rgba(255,255,255,.55);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pulse 900ms ease-out forwards}
@keyframes pulse{from{width:20px;height:20px;opacity:.8}to{width:260px;height:260px;opacity:0}}
</style>
</head>
<body>
<div id="hud"><div id="brand">CICAN CIA</div><div id="state">DECODE</div></div>
<button id="back">EXIT</button>
<div id="mission"><div id="label">ACCESS PATH</div><div id="topic"></div><div id="hint">There is something here. Find the way in.</div></div>
<button id="read">READ THE RECORD</button>
<div id="source">ORIGINAL SOURCE: <a href="https://www.cia.gov/readingroom/" target="_blank" rel="noopener">CIA READING ROOM</a></div>
<script>
const MIN_SIZE=34,MAX_SIZE=180,GROWTH=.5,DOUBLE_TAP=350,SPLIT_OFFSET=45,MERGE_DISTANCE=20;
const topic=new URLSearchParams(location.search).get("topic")||"THE READING ROOM";
document.getElementById("topic").textContent=topic.toUpperCase();
let ones=[],selected=null,growing=false,lastTap=0,lastTapped=null,readUnlocked=false;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function make(x,y,size=MIN_SIZE){const el=document.createElement("div");el.className="cican";document.body.appendChild(el);return {x,y,targetX:x,targetY:y,size,el}}
function face(o){o.el.style.width=o.size+"px";o.el.style.height=o.size+"px";o.el.style.left=o.x+"px";o.el.style.top=o.y+"px";o.el.innerHTML='<span class="eye l"></span><span class="eye r"></span>'}
function spawn(x,y,size){const o=make(x,y,size);ones.push(o);face(o);return o}
function split(o){
 const side=o.x<innerWidth/2?1:-1;
 const n=spawn(Math.max(20,Math.min(innerWidth-20,o.x+SPLIT_OFFSET*side)),o.y,o.size);
 n.targetX=n.x;n.targetY=n.y;
 o.targetX=Math.max(20,Math.min(innerWidth-20,o.x-SPLIT_OFFSET*side));o.targetY=o.y;
 selected=n;lastTapped=null;
}
function pulse(x,y){const p=document.createElement("div");p.className="pulse";p.style.left=x+"px";p.style.top=y+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),950)}
function merge(a,b){
 const fullA=a.size>=MAX_SIZE,fullB=b.size>=MAX_SIZE;
 const x=(a.x+b.x)/2,y=(a.y+b.y)/2;
 a.el.remove();b.el.remove();ones=ones.filter(o=>o!==a&&o!==b);
 const n=spawn(x,y,Math.min(MAX_SIZE,Math.sqrt(a.size*a.size+b.size*b.size)));
 pulse(x,y);selected=n;
 if(fullA&&fullB){n.size=MAX_SIZE;face(n);unlockRead()}
}
function unlockRead(){
 if(readUnlocked)return;readUnlocked=true;
 document.getElementById("state").textContent="ACCESS GRANTED";
 document.getElementById("hint").textContent="The record is ready.";
 document.getElementById("read").classList.add("ready");
}
function reset(){ones.forEach(o=>o.el.remove());ones=[];readUnlocked=false;document.getElementById("read").classList.remove("ready");document.getElementById("state").textContent="DECODE";selected=spawn(innerWidth/2,innerHeight/2,MIN_SIZE)}
function loop(){
 for(const o of ones){
  o.x+=(o.targetX-o.x)*.10;o.y+=(o.targetY-o.y)*.10;
  if(growing&&selected===o){o.size=Math.min(MAX_SIZE,o.size+GROWTH);face(o)}
  face(o)
 }
 for(let i=0;i<ones.length;i++)for(let j=i+1;j<ones.length;j++){
  if(dist(ones[i],ones[j])<=MERGE_DISTANCE){merge(ones[i],ones[j]);break}
 }
 requestAnimationFrame(loop)
}
addEventListener("pointerdown",e=>{
 if(e.target.id==="read"||e.target.id==="back")return;
 let nearest=ones.reduce((a,o)=>!a||dist({x:e.clientX,y:e.clientY},o)<dist({x:e.clientX,y:e.clientY},a)?o:a,null);
 if(nearest){
  selected=nearest;growing=true;
  const now=performance.now();
  if(now-lastTap<DOUBLE_TAP&&lastTapped===nearest)split(nearest);
  lastTap=now;lastTapped=nearest;
 }
});
addEventListener("pointerup",()=>growing=false);
document.getElementById("back").onclick=()=>location.href="index.html";
document.getElementById("read").onclick=()=>{location.href="https://www.cia.gov/readingroom/";};
selected=spawn(innerWidth/2,innerHeight*.55,MIN_SIZE);loop();
</script>
</body>
</html>
